name: Kiro refinement

on:
  push:
    branches: [codex/kiro-refinement, "codex/kiro-sync/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kiro-refinement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.repository == 'brandonvincitore/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - uses: ./.github/actions/setup-ci-deps

      - name: Use the repository's Vite+ version
        run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install the browser test runtime
        working-directory: apps/web
        run: vp exec playwright install --with-deps chromium --only-shell

      - name: Resolve the integrated upstream base
        id: comparison
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git refs/heads/main:refs/remotes/t3-upstream/main
          base=$(git merge-base HEAD refs/remotes/t3-upstream/main)
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Set up Rust for the native helper
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: rustfmt

      - name: Check the integrated changes
        env:
          COMPARISON_BASE: ${{ steps.comparison.outputs.base }}
        run: vp run check:changed "$COMPARISON_BASE" --concurrency 1 --timeout 1500

      - name: Replay the Kiro protocol fixtures
        working-directory: apps/server
        run: vp test run src/orchestration-v2/testkit/KiroReplayFixtures.integration.test.ts --maxWorkers=1

      - name: Build the bundled web client and server
        run: vp run --filter t3 --concurrency-limit 1 build

      - name: Check the preview version
        run: node apps/server/dist/bin.mjs --version
